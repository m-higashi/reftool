# =========================================================================
#  文献リファレンスツール 設定ファイル
#  このフォルダごと別のPCに移しても動くよう、絶対パスは書かないこと。
#  変更後はツールを再起動すると反映されます。
# =========================================================================

[server]
# バインドするIPアドレス。同一PCのみなら "127.0.0.1"。
# 他の端末(Tailscaleなど)からも開くときは "0.0.0.0" のままにする。
host = "0.0.0.0"
port = 8585

# 接続を許す相手。このツールには合言葉(認証)がないため、既定では
# 「このPC自身」と「Tailscale経由」だけに絞っています。
#   "tailscale" … このPCとTailscaleのみ(同じLANの他の端末からは開けません)
#   "lan"       … 上に加えて、同じLANの端末からも開けるようにする
#   "any"       … 制限しない(信頼できるネットワークでのみ)
allow = "tailscale"

[labels]
# メモ欄のラベル名(UIに表示される)
memo1 = "メモ"          # 自由記入のメモ
memo2 = "目次"          # 目次や索引の貼り付け用

[categories]
# 利用可能なカテゴリの一覧(UIのプルダウンに出る順)。
# ここは「例」です。自分の資料に合う名前に自由に書き換えてください。
list = ["書籍", "論文", "雑誌", "資料", "ネット", "それ以外"]
# どれにも当てはまらない場合のカテゴリ
default = "それ以外"

# フォルダ名 → カテゴリ の自動判定ルール。
# 「フォルダのパスにこの語が含まれていれば、そのカテゴリ」。
# 上から順に評価し、最初に一致したものを採用する。
# 手動でカテゴリを変更したファイルは、再スキャンでは上書きされない。
[[categories.rules]]
keyword = "書籍"
category = "書籍"

[[categories.rules]]
keyword = "論文"
category = "論文"

[[categories.rules]]
keyword = "雑誌"
category = "雑誌"

[[categories.rules]]
keyword = "資料"
category = "資料"

[[categories.rules]]
keyword = "ネット"
category = "ネット"

[[categories.rules]]
keyword = "web"
category = "ネット"

[crossref]
# DOIから正式タイトル・雑誌名・著者・年を補完する。
# オフライン時やAPI失敗時は自動でローカル抽出値にフォールバックする。
enabled = true
# 連絡先メール(Crossrefの「polite pool」用。任意だが推奨)。
# 書いておくと混雑時に優先されやすくなります。書かなくても動きます。
mailto = ""
timeout_seconds = 8

[scan]
# スキャン対象の拡張子(小文字)
extensions = ["pdf", "ppt", "pptx"]
# DOI/タイトル抽出で読む先頭ページ数
metadata_pages = 3

[backup]
# 起動時に1日1回 _reftool/backups/ にDBをコピーする。
enabled = true
keep = 30   # 保持世代数
