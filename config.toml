# =========================================================================
#  文献リファレンスツール 設定ファイル
#  このフォルダごと別PCに移しても動くよう、絶対パスは書かないこと。
#  変更後はツールを再起動すると反映されます。
# =========================================================================

[server]
# バインドするIPアドレス。同一PCのみなら "127.0.0.1"。
# Tailscale越しにアクセスするときは、この行を「そのPCのTailscale IP」に
# 書き換えるか、"0.0.0.0"(全インターフェース)のままにする。
host = "0.0.0.0"
port = 8585

[labels]
# メモ欄のラベル名(UIに表示される)
memo1 = "メモ"          # ユーザーの手書きメモ用
memo2 = "目次"          # 目次などの自動登録用

[categories]
# 利用可能なカテゴリの一覧(UIのプルダウンに出る順)。
list = ["教科書", "ネット", "雑誌", "論文", "それ以外", "国試", "研修医"]
# どれにも当てはまらない場合のカテゴリ
default = "それ以外"

# フォルダ名 → カテゴリ の自動判定ルール。
# 「フォルダのパスにこの語が含まれていれば、そのカテゴリ」。
# 上から順に評価し、最初に一致したものを採用する。
# 手動でカテゴリを変更したファイルは、再スキャンでは上書きされない。
[[categories.rules]]
keyword = "教科書"
category = "教科書"

[[categories.rules]]
keyword = "ネット"
category = "ネット"

[[categories.rules]]
keyword = "web"
category = "ネット"

[[categories.rules]]
keyword = "雑誌"
category = "雑誌"

[[categories.rules]]
keyword = "論文"
category = "論文"

[crossref]
# DOIから正式タイトル・雑誌名・著者・年を補完する。
# オフライン時やAPI失敗時は自動でローカル抽出値にフォールバックする。
enabled = true
# 連絡先メール(Crossrefの「polite pool」用。任意だが推奨)
mailto = ""
timeout_seconds = 8

[scan]
# スキャン対象の拡張子(小文字)
extensions = ["pdf", "ppt", "pptx"]
# DOI/タイトル抽出で読む先頭ページ数
metadata_pages = 3

[backup]
# 起動時に1日1回 _reftool/backups/ にDBをコピーする。
enabled = true
keep = 30   # 保持世代数
